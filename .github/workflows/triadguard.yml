name: TriadGuard-CI Autonomous Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  triad-guardian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (Conductor)
        run: |
          pip install pygithub pyyaml requests

      - name: Structuralist - Static code quality scan
        uses: SonarSource/sonarcloud-github-action@v2.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true
        continue-on-error: true

      - name: Sentinel - Security and secret scanning (Trivy)
        uses: aquasecurity/trivy-action@0.19.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Sentinel - Deep code analysis (CodeQL)
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript, csharp
        continue-on-error: true

      - name: Run Conductor (Decision Engine)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python scripts/conductor.py

      - name: Update PR status (Final verdict)
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const conclusion = '${{ job.status }}';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🏛️ **TriadGuard Architect Report:**\n- Status: ${conclusion === 'success' ? '✅ All checks passed. Structure is solid.' : '⚠️ Please review the warnings above.'}`
            });
