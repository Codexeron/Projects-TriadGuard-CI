name: TriadGuard-CI Autonomous Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  triad-guardian:
    name: TriadGuard Autonomous Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conductor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygithub pyyaml requests

      #########################################################
      # Structuralist (SonarCloud)
      #########################################################

      - name: Structuralist - Static code quality scan
        uses: SonarSource/sonarcloud-github-action@v2.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
        continue-on-error: true

      #########################################################
      # Sentinel (Trivy)
      #########################################################

      - name: Sentinel - Security and secret scanning
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true

      - name: Upload Trivy SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      #########################################################
      # CodeQL
      #########################################################

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: |
            python
            javascript
            csharp
        continue-on-error: true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

      #########################################################
      # Conductor
      #########################################################

      - name: Run Conductor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python scripts/conductor.py

      #########################################################
      # Final Report
      #########################################################

      - name: Update Pull Request Status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const conclusion = "${{ job.status }}";

            const message =
              conclusion === "success"
                ? "🏛️ **TriadGuard Architect Report**\n\n✅ All automated checks completed successfully."
                : "🏛️ **TriadGuard Architect Report**\n\n⚠️ One or more checks reported warnings or errors. Please review the workflow logs.";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
